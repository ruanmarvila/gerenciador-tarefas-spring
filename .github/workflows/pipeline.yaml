name: tests
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution:  'temurin'
          cache: maven
        
      - name: Build and test with Maven
        run: mvn clean install
