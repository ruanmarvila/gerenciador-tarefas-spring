spring.application.name=gerenciador-tarefas
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gerenciador_tarefas}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.config.import=optional:classpath:application-security.properties

management.endpoints.web.exposure.include=health
spring.jpa.open-in-view=false